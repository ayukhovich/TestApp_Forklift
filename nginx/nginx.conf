worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Ограничение размеров
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # Таймауты
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;

    # Базовые ограничения безопасности
    server_tokens off;
    
    # Ограничение частоты запросов
    limit_req_zone $binary_remote_addr zone=req_limit:10m rate=10r/s;

    # Блокировка вредоносных User-Agent
    map $http_user_agent $bad_bot {
        default 0;
        ~*(bot|spider|crawl|scan|attack) 1;
    }

    upstream app {
        server app:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # Ограничение частоты запросов
        limit_req zone=req_limit burst=20 nodelay;

        # Безопасность заголовки
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Блокировка sitemap.xml и других статических ресурсов сканеров - возвращаем 404
        location = /robots.txt {
            return 404;
            access_log off;
        }

        location = /sitemap.xml {
            return 404;
            access_log off;
        }

        # Блокировка вредоносных путей (но разрешаем /api/)
        location ~* ^/(boaform|admin|_next|graphql|v2|wp-admin|wp-content|phpmyadmin|env|.git) {
            return 403;
            access_log off;
        }

        # Блокировка скрытых файлов
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Блокировка расширений
        location ~ /\.(git|env|md|sql|log|bak|conf) {
            deny all;
        }

        # Блокировка методов (только для опасных)
        if ($request_method !~ ^(GET|POST|PUT|DELETE|HEAD)$) {
            return 405;
        }

        location / {
            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            proxy_buffering off;
            proxy_request_buffering off;
        }

        # health check для Docker
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
