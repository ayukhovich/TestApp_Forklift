spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/forkliftdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations:

  thymeleaf:
    cache: false

# Настройки приложения
app:
  pagination:
    default-size: 20
  search:
    case-insensitive: true

server:
  port: 8080
