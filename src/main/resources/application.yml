spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/forkliftdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations:

  thymeleaf:
    cache: false

app:
  pagination:
    default-size: 20
  search:
    case-insensitive: true

server:
  port: 8080

logging:
  file:
    name: logs/application.log
    max-size: 10MB
    max-history: 10
  level:
    root: INFO
    com.example.forklift: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
